# Daily auto-update: fetch new hackathons from public, no-login sources
# (Devpost public listing page) and commit them if anything changed.
# Runs daily at 03:00 UTC = 08:30 IST. Needs NO secrets.
# Unstop / Devfolio / Hack2Skill are login/JS-protected and are NOT scraped
# here — those listings come from the daily Muse scan (see README.md).
name: Daily events update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch new public listings
        run: node scripts/update-events.mjs
      - name: Commit if data changed
        run: |
          git config user.name "hackathon-portal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || git commit -m "chore(data): daily auto-update $(date -u +%F)"
          git push
